services:
  - type: web
    name: pragna-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: pragna-data
      mountPath: /data
      sizeGB: 5
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: DB_PATH
        value: /data/pragna.db
      - key: CHROMA_PATH
        value: /data/chroma_db
      - key: DOCUMENTS_DIR
        value: /data/documents
      - key: RAG_SIMILARITY_THRESHOLD
        value: "0.5"
      - key: OLLAMA_URL
        sync: false
      - key: CHAT_MODEL
        sync: false
      - key: EMBED_MODEL
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: OLLAMA_API_KEYS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false

  - type: web
    name: pragna-frontend
    runtime: node
    rootDir: chatbot-ui-vite
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run preview -- --host 0.0.0.0 --port 5180
    healthCheckPath: /
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: NODE_VERSION
        value: "20"
