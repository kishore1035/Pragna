services:
  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - CHAT_MODEL=gemma4:cloud
      - EMBED_MODEL=nomic-embed-text
      - RAG_SIMILARITY_THRESHOLD=0.5
      - DB_PATH=/app/data/argus.db
      - CHROMA_PATH=/app/data/chroma_db
      - DOCUMENTS_DIR=/app/data/documents
      - JWT_SECRET=${JWT_SECRET:-6e2acf507b8c71a14cae72d13677ac93a747cc2d97d0188ca7c9999d9de95235}
      - STABILITY_API_KEY=${STABILITY_API_KEY:-sk-80CgzN6VbDfUAAZWnVuJvndHlDDmCWzMTaeqlvgEWT2KkH9N}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-814542330227-7r5s094qujff3nsb56dl73udfttgji91.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-Ov23lixpoUPbbr7NolpE}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-0b885f09623a9119b34237eabf3798e1a159b606}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data

  # Frontend Service (Next.js with Argus UI)
  frontend:
    build:
      context: ./chatbot-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: argus-frontend
    restart: unless-stopped
    ports:
      - "4028:4028"
    depends_on:
      - backend
