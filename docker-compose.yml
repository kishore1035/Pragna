services:
  # Backend Service (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: argus-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - CHAT_MODEL=gemma4:cloud
      - EMBED_MODEL=nomic-embed-text
      - RAG_SIMILARITY_THRESHOLD=0.5
      - DB_PATH=/app/data/argus.db
      - CHROMA_PATH=/app/data/chroma_db
      - DOCUMENTS_DIR=/app/data/documents
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - STABILITY_API_KEY=${STABILITY_API_KEY:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/data:/app/data

  # Frontend Service (Next.js with Argus UI)
  frontend:
    build:
      context: ./chatbot-ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8000}
    container_name: argus-frontend
    restart: unless-stopped
    ports:
      - "4028:4028"
    depends_on:
      - backend
